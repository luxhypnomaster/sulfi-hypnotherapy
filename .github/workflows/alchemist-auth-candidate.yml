name: Alchemist 16-A single master auth candidate (private draft)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: alchemist-auth-candidate-23
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'luxhypnomaster/sulfi-hypnotherapy'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALCHEMIST_API: ${{ vars.SULFI_ALCHEMIST_API }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.SULFI_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require successful pinned app checks and complete runtime config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$ALCHEMIST_API"
          node scripts/alchemist/check-build-config.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const c=JSON.parse(fs.readFileSync('server/alchemist/auth-candidate-source.json'));
          const r=JSON.parse(execFileSync('gh',['api','repos/luxhypnomaster/sulfi-hypnotherapy/actions/runs/'+c.verifiedChecksRun],{encoding:'utf8'}));
          if(r.conclusion!=='success'||r.head_sha!==c.sourceSha||r.head_branch!==c.branch||r.event!=='workflow_dispatch'||r.path!=='.github/workflows/checks.yml')throw Error('PINNED_CHECKS_NOT_SUCCESSFUL');
          const repo=JSON.parse(execFileSync('gh',['api','repos/luxhypnomaster/sulfi-hypnotherapy'],{encoding:'utf8'}));if(repo.private!==true)throw Error('PRIVATE_REPOSITORY_REQUIRED');
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 74dd63c31d532fd976e86d8783408ae109afe2fd
          path: app-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./app-source/.github/actions/setup-flutter
      - name: Resolve the tested app dependencies
        working-directory: app-source
        run: flutter pub get --enforce-lockfile
      - name: Restore the existing signing key (no clasp credentials)
        env:
          KEY_BASE64: ${{ secrets.SULFI_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/sulfi-test.keystore"
      - name: Build only the master candidate with exact live config
        working-directory: app-source
        env:
          SULFI_SIGNING_STORE_FILE: ${{ runner.temp }}/sulfi-test.keystore
          SULFI_SIGNING_STORE_PASSWORD: ${{ secrets.SULFI_TEST_STORE_PASSWORD }}
          SULFI_SIGNING_KEY_ALIAS: ${{ secrets.SULFI_TEST_KEY_ALIAS }}
          SULFI_SIGNING_KEY_PASSWORD: ${{ secrets.SULFI_TEST_KEY_PASSWORD }}
        run: flutter build apk --debug --dart-define="SULFI_ALCHEMIST_API=$ALCHEMIST_API" --dart-define="SULFI_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
      - name: Check package, signature and new version
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="app-source/build/app/outputs/flutter-apk/app-debug.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/CANDIDATE_CERT.txt"
          grep -q '0b7435682d27200e630d5837d40457fa64e905d8c43c4ea692c7e1a2d810afc6' "$RUNNER_TEMP/CANDIDATE_CERT.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/CANDIDATE_BADGING.txt"
          grep -q "name='ru.sulfi.sulfi_hypnotherapy'" "$RUNNER_TEMP/CANDIDATE_BADGING.txt"
          grep -q "versionCode='23'" "$RUNNER_TEMP/CANDIDATE_BADGING.txt"
          sha256sum "$APK"
          python3 - <<'PYCODE'
          import os,zipfile
          with zipfile.ZipFile('app-source/build/app/outputs/flutter-apk/app-debug.apk') as z:
              kernel=z.read('assets/flutter_assets/kernel_blob.bin')
          for key in ['ALCHEMIST_API','GOOGLE_WEB_CLIENT_ID']:
              value=os.environ[key].encode()
              assert value and value in kernel, 'COMPILED_PUBLIC_CONFIG_READBACK_FAILED'
          print('COMPILED_ENDPOINT_AND_WEB_ID_READBACK_PASS')
          PYCODE
      - name: Deliver in a private repository draft (without Actions artifact storage)
        env:
          GH_TOKEN: ${{ github.token }}
          SULFI_CANDIDATE_DELIVERY_EXECUTE: '1'
          CANDIDATE_APK: app-source/build/app/outputs/flutter-apk/app-debug.apk
        run: node scripts/alchemist/auth-candidate-delivery.mjs
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/sulfi-test.keystore"
