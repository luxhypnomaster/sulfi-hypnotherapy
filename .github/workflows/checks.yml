      - name: Build disposable testOnly packages, NEVER user candidates or existing signing
        if: steps.probe_cache18.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/task18-probe-apks"
          for EDITION in master client; do
            EXTRA=()
            if [ "$EDITION" = client ]; then EXTRA+=(--dart-define=SULFI_EDITION=client); fi
            flutter build apk --debug --target-platform=android-x64 --target=test_driver/transfer_probe.dart --dart-define=SULFI_TRANSFER_PROBE=true "${EXTRA[@]}"
            cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/task18-probe-apks/$EDITION.apk"
          done
          cd android
          ./gradlew --stop
          cd ..
          python3 scripts/task18/probe_apk_manifest.py create
      - uses: actions/cache/save@v4
        if: steps.probe_cache18.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/task18-probe-apks
          key: ${{ steps.probe_cache18.outputs.cache-primary-key }}
      - name: Verify every fixture byte and exact testOnly package before any ADB install
        run: python3 scripts/task18/probe_apk_manifest.py verify
      - name: Disposable host space and UI helper, no owner data or credentials
        run: |
          bash scripts/task16g/prepare_native_runner.sh
          bash scripts/task16v/build_ui_probe.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          PROBE18_LATENCY_MS=2000 node scripts/task18/fixture_server.mjs > "$RUNNER_TEMP/task18-fixture-server.log" 2>&1 &
      - name: Actual OS-owned headless execution after UI engine destruction and display off
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.task18_api }}
          arch: x86_64
          target: google_apis
