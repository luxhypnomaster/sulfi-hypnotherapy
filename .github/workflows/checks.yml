name: Flutter checks and Android debug APK
on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ['docs/**', 'reports/**', 'README.md', 'BACKLOG.md', 'CHANGELOG.md']
  push:
    branches: [develop]
    paths-ignore: ['docs/**', 'reports/**', 'README.md', 'BACKLOG.md', 'CHANGELOG.md']
  workflow_dispatch:
    inputs:
      p0_scope:
        description: 'UI upgrade core, or optional native recorder24 gate'
        type: choice
        options: [core, recording]
        default: core
      p0_native:
        description: '16V immutable APK24 UI-created update investigation; no build/signing'
        type: boolean
        default: false
      p0_checks:
        description: '16V hotfix regressions only; no build/signing'
        type: boolean
        default: false
      emulator_qa:
        description: '16B isolated APK24 to25 native QA, no Google identities'
        type: boolean
        default: false
      qa_scope:
        description: 'Native smoke or isolated APK24/APK25 playback diagnosis'
        type: choice
        options: [smoke, playback]
        default: smoke
      build_mode:
        description: '16-A: checks only; one auth candidate; or final dual APK after real server acceptance'
        type: choice
        options: [checks, auth-candidate, dual-apk]
        default: checks

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}${{ inputs.p0_checks && '-p0-diagnostics' || '' }}
  cancel-in-progress: true

jobs:
  verify:
    if: inputs.p0_native != true && inputs.p0_checks != true && inputs.emulator_qa != true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALCHEMIST_API: ${{ vars.SULFI_ALCHEMIST_API }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.SULFI_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: P0 STOP-SHIP forbids building or signing any Sulfi candidate
        if: github.ref == 'refs/heads/hotfix/task16v-p0-data-preservation' && github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        run: |
          echo 'BLOCKED: Task16V preservation/recovery gates are not accepted. No Sulfi APK build/sign/upload is allowed.'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Validate offline Task15 JSON schemas and contract fixtures
        run: |
          python3 -m pip install -r scripts/task15-contract-requirements.txt
          python3 scripts/task15_contract_check.py
      - run: node --test server/google_apps_script/test/backend.test.mjs
      - run: node --test server/alchemist/test/*.test.mjs
      - run: node scripts/alchemist/build.mjs "$RUNNER_TEMP/alchemist-source"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - name: Flutter tests with failure summaries
        run: |
          set +e
          flutter test --reporter json > "$RUNNER_TEMP/flutter-tests.jsonl" 2>&1
          TEST_STATUS=$?
          set -e
          python3 scripts/flutter_test_summary.py "$RUNNER_TEMP/flutter-tests.jsonl" "$RUNNER_TEMP/flutter-test-summary.json"
          exit "$TEST_STATUS"
      - name: Preserve test report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sulfi-flutter-test-report-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flutter-tests.jsonl
            ${{ runner.temp }}/flutter-test-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - run: flutter test test/task5_client_build_test.dart test/task15_client_test.dart --dart-define=SULFI_EDITION=client
      - name: Verify configured cloud endpoint before embedding it
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        run: |
          node scripts/alchemist/check-build-config.mjs

      - name: Require accepted real two-account server before final pair
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'dual-apk'
        env:
          ACCEPTED_SERVER_SOURCE: ${{ vars.SULFI_16A_ACCEPTED_SERVER_SOURCE }}
        run: node scripts/alchemist/check-accepted-server.mjs
      - name: Restore persistent user-test signing key
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        env:
          SULFI_TEST_KEYSTORE_BASE64: ${{ secrets.SULFI_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$SULFI_TEST_KEYSTORE_BASE64" || { echo 'Missing persistent test signing key. Refusing a newly signed APK.'; exit 1; }
          printf '%s' "$SULFI_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sulfi-test.keystore"
          chmod 600 "$RUNNER_TEMP/sulfi-test.keystore"
      - name: Build author APK (explicit configuration, no invented endpoint)
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        run: flutter build apk --debug --dart-define="SULFI_ALCHEMIST_API=$ALCHEMIST_API" --dart-define="SULFI_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
        env:
          SULFI_SIGNING_STORE_FILE: ${{ runner.temp }}/sulfi-test.keystore
          SULFI_SIGNING_STORE_PASSWORD: ${{ secrets.SULFI_TEST_STORE_PASSWORD }}
          SULFI_SIGNING_KEY_ALIAS: ${{ secrets.SULFI_TEST_KEY_ALIAS }}
          SULFI_SIGNING_KEY_PASSWORD: ${{ secrets.SULFI_TEST_KEY_PASSWORD }}
      - name: Record public APK diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/APK_CERT.txt
          grep -q '0b7435682d27200e630d5837d40457fa64e905d8c43c4ea692c7e1a2d810afc6' build/app/outputs/flutter-apk/APK_CERT.txt
          "$BUILD_TOOLS/aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/APK_BADGING.txt
          grep -q "name='ru.sulfi.sulfi_hypnotherapy'" build/app/outputs/flutter-apk/APK_BADGING.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS
          cat build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        with:
          name: sulfi-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'checks'
        with:
          name: sulfi-android-diagnostics-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/APK_CERT.txt
            build/app/outputs/flutter-apk/APK_BADGING.txt
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Build separate client test APK (same code and persistent key)
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'dual-apk'
        run: flutter build apk --debug --dart-define=SULFI_EDITION=client --dart-define="SULFI_ALCHEMIST_API=$ALCHEMIST_API" --dart-define="SULFI_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
        env:
          SULFI_SIGNING_STORE_FILE: ${{ runner.temp }}/sulfi-test.keystore
          SULFI_SIGNING_STORE_PASSWORD: ${{ secrets.SULFI_TEST_STORE_PASSWORD }}
          SULFI_SIGNING_KEY_ALIAS: ${{ secrets.SULFI_TEST_KEY_ALIAS }}
          SULFI_SIGNING_KEY_PASSWORD: ${{ secrets.SULFI_TEST_KEY_PASSWORD }}
      - name: Record client APK diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'dual-apk'
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/CLIENT_CERT.txt"
          grep -q '0b7435682d27200e630d5837d40457fa64e905d8c43c4ea692c7e1a2d810afc6' "$RUNNER_TEMP/CLIENT_CERT.txt"
          "$BUILD_TOOLS/aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/CLIENT_BADGING.txt"
          grep -q "name='ru.sulfi.sulfi_hypnotherapy.clienttest'" "$RUNNER_TEMP/CLIENT_BADGING.txt"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/CLIENT_SHA256SUMS"
          cat "$RUNNER_TEMP/CLIENT_SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'dual-apk'
        with:
          name: sulfi-client-test-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'dual-apk'
        with:
          name: sulfi-client-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CLIENT_CERT.txt
            ${{ runner.temp }}/CLIENT_BADGING.txt
            ${{ runner.temp }}/CLIENT_SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  emulator_qa:
    # GitHub draft assets require a write-capable integration token to be visible.
    # This exact-branch manual job performs GETs only; repository/Drive ACLs are unchanged.
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.emulator_qa == true && github.ref == 'refs/heads/fix/task16b-auth-transfer-publication' && github.repository == 'luxhypnomaster/sulfi-hypnotherapy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Hardware gate before installing any emulator image
        id: kvm
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'KVM_GATE=PASS'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'KVM_GATE=BLOCKED_NO_DEVICE; NO_SYSTEM_IMAGE_INSTALLED'
          fi
      - name: Download existing immutable APKs (read-only, no signing/OAuth secrets)
        if: steps.kvm.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk25"
          gh api repos/luxhypnomaster/sulfi-hypnotherapy/releases/assets/736432720 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/apk25/master24.apk"
          python3 - <<'PYCODE'
          import hashlib,os,pathlib,json,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'apk25'
          assert hashlib.sha256((root/'master24.apk').read_bytes()).hexdigest()=='a242d8222af27c936f44c86b47e2cf674c3789072c3a7cac9aa4bba3afe3cda1'
          release=next(r for r in json.loads(subprocess.check_output(['gh','api','repos/luxhypnomaster/sulfi-hypnotherapy/releases?per_page=100'])) if r['tag_name']=='task16b-qa-pair-25')
          assert release['draft'] is True and release['target_commitish']=='012f7f69b7ad99c0d44f2a442d9649aa1481117e'
          subprocess.run(['git','diff','--exit-code','012f7f69b7ad99c0d44f2a442d9649aa1481117e','--','lib','android','pubspec.yaml','pubspec.lock','server/alchemist/src'],check=True,stdout=subprocess.DEVNULL)
          for edition in ['master','client']:
              asset=next(a for a in release['assets'] if a['name']=='sulfi-'+edition+'-test-25.apk')
              output=root/(edition+'25.apk')
              with output.open('wb') as f: subprocess.run(['gh','api','repos/luxhypnomaster/sulfi-hypnotherapy/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=f,check=True)
              assert asset['digest']=='sha256:'+hashlib.sha256(output.read_bytes()).hexdigest()
          print('APK24_AND_EXACT_SOURCE_APK25_DIGESTS_VERIFIED')
          PYCODE
      - name: Run existing APKs on actual Android emulator (synthetic local data)
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        env:
          SULFI_QA_SCOPE: ${{ inputs.qa_scope }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: python3 scripts/task16_autonomous/emulator_qa.py
      - name: Record fixed-schema evidence even when artifact quota is exceeded
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'emulator-evidence/EMULATOR_QA.json'
          if p.exists():
              v=json.loads(p.read_text())
              for row in v['cases']: print('EMULATOR_RESULT='+json.dumps(row,separators=(',',':')))
          else: print('EMULATOR_QA=BLOCKED_OR_NOT_RUN; NO_GOOGLE_USERS')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: task16-autonomous-emulator-${{ github.run_id }}
          path: ${{ runner.temp }}/emulator-evidence/
          retention-days: 14
          if-no-files-found: ignore

  native_upgrade:
    if: inputs.p0_native == true && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hotfix/task16v-p0-data-preservation' && github.repository == 'luxhypnomaster/sulfi-hypnotherapy'
    permissions:
      contents: write # GET existing private draft APK assets only; no publication
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Hardware gate
        id: kvm
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED_NO_KVM_NO_IMAGE_INSTALL'
          fi
      - name: Read immutable APK24 and APK25
        if: steps.kvm.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/task16v-apks"
          gh api repos/luxhypnomaster/sulfi-hypnotherapy/releases/assets/736432720 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/task16v-apks/master24.apk"
          gh api repos/luxhypnomaster/sulfi-hypnotherapy/releases/assets/738283668 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/task16v-apks/master25.apk"
          python3 - <<'PYCODE'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'task16v-apks'
          expected={'master24.apk':'a242d8222af27c936f44c86b47e2cf674c3789072c3a7cac9aa4bba3afe3cda1','master25.apk':'d0c8704673434b43fc7ceebbaceff4c3f2075a780964063c06dffeed03bc50c9'}
          for n,h in expected.items(): assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h
          print('IMMUTABLE_APK_SHA_PASS')
          PYCODE
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for N in 24 25; do
            "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/task16v-apks/master$N.apk" | grep -E 'certificate SHA-256 digest|certificate SHA-1 digest'
            "$TOOLS/aapt" dump badging "$RUNNER_TEMP/task16v-apks/master$N.apk" | head -1
          done
      - name: Compile disposable Android UI accessibility probe (not Sulfi APK)
        if: steps.kvm.outputs.available == 'true'
        run: bash scripts/task16v/build_ui_probe.sh
      - name: Native UI creation then normal update; no DB writes by harness
        env:
          P0_QA_SCOPE: ${{ inputs.p0_scope }}
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -cores 2 -noaudio -no-boot-anim -camera-back none -memory 1536
          script: bash scripts/task16v/run_native.sh
      - name: Preserve synthetic-only native evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: task16v-native-ui-${{ github.sha }}
          path: ${{ runner.temp }}/task16v-evidence
          retention-days: 14


  regressions:
    if: inputs.p0_checks == true && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hotfix/task16v-p0-data-preservation' && github.repository == 'luxhypnomaster/sulfi-hypnotherapy'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Python read-only diagnostics and WAL preservation
        run: python3 -m unittest discover -s scripts/task16v -p 'test_*.py' -v
      - run: node --test server/alchemist/test/*.test.mjs
      - run: node --test server/google_apps_script/test/backend.test.mjs
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - name: Full Flutter regressions; no live server tests without explicit opt-in
        run: |
          set +e
          flutter test --reporter json > "$RUNNER_TEMP/task16v-tests.jsonl" 2>&1
          STATUS=$?
          set -e
          python3 scripts/flutter_test_summary.py "$RUNNER_TEMP/task16v-tests.jsonl" "$RUNNER_TEMP/task16v-test-summary.json"
          cat "$RUNNER_TEMP/task16v-test-summary.json"
          exit "$STATUS"
      - run: flutter test test/task5_client_build_test.dart test/task15_client_test.dart --dart-define=SULFI_EDITION=client
