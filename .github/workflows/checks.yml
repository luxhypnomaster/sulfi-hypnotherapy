          cores: 2
          ram-size: 1536M
          disk-size: 3G
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/task17/pre_emulator.py
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/task18/probe_native.py
      - name: Retain only bounded synthetic receipts/screens with exact byte SHA (no artifact quota retry)
        if: always()
        run: |
          python3 - <<'PROBEPY'
          import os,pathlib,base64,hashlib,json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'task18-probe-evidence'
          for f in sorted(p.glob('*')):
            if f.is_file() and f.stat().st_size<=2*1024*1024:
              b=f.read_bytes();print('TASK18_FILE_META='+json.dumps({'file':f.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}))
              for i in range(0,len(b),32000):print('TASK18_FILE_CHUNK='+f.name+':'+str(i//32000)+':'+base64.b64encode(b[i:i+32000]).decode())
          for q in [pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.task17-forensics/EMULATOR_TERMINATION.json']:
            if q.exists():print('TASK18_EMULATOR_EXIT='+q.read_text())
          PROBEPY

