name: Alchemist deployed runtime diagnosis (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alchemist-runtime-read
  cancel-in-progress: false
jobs:
  read:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'luxhypnomaster/sulfi-hypnotherapy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned SDK before OAuth is loaded
        run: npm install --prefix "$RUNNER_TEMP/clasp-tool" --ignore-scripts --no-audit --no-fund @google/clasp@3.4.1
      - name: Compare anonymous and owner runtime HTTP without publication or bootstrap
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {pathToFileURL} from 'node:url';
          const file=process.env.RUNNER_TEMP+'/runtime-auth.json';
          try{
            if(!process.env.CLASPRC_JSON)throw Error('GITHUB_SECRET_MISSING');
            fs.writeFileSync(file,process.env.CLASPRC_JSON,{mode:0o600});delete process.env.CLASPRC_JSON;
            const root=process.env.RUNNER_TEMP+'/clasp-tool/node_modules/@google/clasp/build/src/auth/';
            const {FileCredentialStore}=await import(pathToFileURL(root+'file_credential_store.js'));
            const {getAuthorizedOAuth2Client}=await import(pathToFileURL(root+'auth.js'));
            const store=new FileCredentialStore(file),saved=await store.load('default'),client=await getAuthorizedOAuth2Client(store,'default');
            const refreshed=await client.refreshAccessToken(),token=refreshed.credentials.id_token;
            if(!token)throw Error('ID_TOKEN_REFRESH_UNAVAILABLE');
            const identity=(await client.verifyIdToken({idToken:token,audience:saved.client_id})).getPayload();
            if(identity.email!=='luxhypnomaster@gmail.com'||identity.email_verified!==true)throw Error('WRONG_OWNER');
            const access=(await client.getAccessToken()).token;
            const endpoint='https://script.google.com/macros/s/AKfycbzw36cEXSHVgfRxSl7k-6c2yV4uyPapqb-zndib8AlbHxhFCstXqxoqvqTMJvlHTT5zEg/exec?op=health';
            for(const [mode,headers] of [['ANONYMOUS',{}],['OWNER_OAUTH',{Authorization:'Bearer '+access}]]){
              let response=await fetch(endpoint,{headers,redirect:'manual',signal:AbortSignal.timeout(30000)});
              for(let i=0;[302,303].includes(response.status);i++){
                const u=new URL(response.headers.get('location'));
                if(i>=3||u.protocol!=='https:'||u.host!=='script.googleusercontent.com'||u.username||u.password)throw Error('UNEXPECTED_GOOGLE_AUTH_REDIRECT');
                response=await fetch(u,{redirect:'manual',signal:AbortSignal.timeout(30000)});
              }
              const mime=response.headers.get('content-type')?.split(';')[0],body=await response.text();
              console.log('RUNTIME_'+mode+'_HTTP='+response.status);
              console.log('RUNTIME_'+mode+'_JSON='+(mime==='application/json'?'YES':'NO'));
              if(mime==='application/json'){
                const v=JSON.parse(body);console.log('RUNTIME_'+mode+'_HEALTH_VERIFIED='+(v.ok===true&&v.result?.name==='Сервер Проекта Алхимик'&&v.result?.fullSourceReady===true?'YES':'NO'));
              }else {
                console.log('RUNTIME_'+mode+'_ACCESS_DENIED='+(body.includes('You need access')?'YES':'NO'));
                const visible=body.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ');
                for(const [label,pattern] of Object.entries({AUTHORIZATION_REQUIRED:/Authorization is required|Требуется авторизац|Необходима авторизац/i,CONSENT:/authorize|authorization|авторизац|разрешени/i,FUNCTION_MISSING:/Script function not found/i,SYNTAX_ERROR:/SyntaxError/i,REFERENCE_ERROR:/ReferenceError/i,TYPE_ERROR:/TypeError/i,EXCEPTION:/Exception/i,QUOTA:/too many times|quota exceeded/i,SIGN_IN:/Sign in|Войти в аккаунт/i})){
                  if(pattern.test(visible))console.log('RUNTIME_'+mode+'_MARKER='+label);
                }
              }
            }
            console.log('READ_ONLY_NO_BOOTSTRAP_NO_CLOUD_WRITE');
          }catch(e){console.error(/^[A-Z_]{1,80}$/.test(e.message)?e.message:'RUNTIME_DIAGNOSIS_FAILED_REDACTED');process.exitCode=1;}
          finally{delete process.env.CLASPRC_JSON;fs.rmSync(file,{force:true});}
          JS
      - name: Always remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/runtime-auth.json"
