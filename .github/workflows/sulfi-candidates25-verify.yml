        path: |-
          ${{ runner.temp }}/task25-native-evidence/
          ${{ runner.temp }}/SIGNED_PAIR_INDEPENDENT_READBACK_25.json
          ${{ runner.temp }}/CANDIDATE25_BLOCKER.json
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: false
        overwrite: false
    needs: native35
    strategy:
      fail-fast: false
