      matrix:
        edition:
        - master
        - client
  delivery:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
