name: Task25 independent APK readback and disposable upgrade safety
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: VERIFY_DISPOSABLE_ANDROID_ONLY
        required: true
        type: string
        default: ''
      build_run:
        description: Successful Task25 main build run ID; same APK bytes, no signing here
        required: true
        type: string
      diagnostic_master_only:
        description: MASTER API35 crash metadata only; disables API36 and all tester delivery
        type: boolean
        default: false
        required: false
permissions: {}
concurrency:
  group: task25-candidate-native-qa
  cancel-in-progress: false
env:
  CANDIDATE25_WORKFLOW: .github/workflows/sulfi-candidates25-verify.yml
  CANDIDATE25_CONFIRMATION: ${{ inputs.confirmation }}
  CANDIDATE25_BUILD_RUN: ${{ inputs.build_run }}
jobs:
  trust:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'VERIFY_DISPOSABLE_ANDROID_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
    - name: Reject untrusted dispatch before any checkout or secret
      run: |-
        python3 - <<'PYCODE'
        import os
        expected={'GITHUB_REPOSITORY':'luxhypnomaster/sulfi-hypnotherapy','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_REF':'refs/heads/main','GITHUB_REF_PROTECTED':'true','GITHUB_ACTOR':'luxhypnomaster','GITHUB_TRIGGERING_ACTOR':'luxhypnomaster','CANDIDATE25_CONFIRMATION':'VERIFY_DISPOSABLE_ANDROID_ONLY'}
        assert all(os.environ.get(k)==v for k,v in expected.items()), 'OWNER_PROTECTED_MAIN_REQUIRED'
        print('TRUST_BOUNDARY_PASS_NO_SECRETS')
        PYCODE
    - name: Validate numeric run input without shell interpolation
      run: |-
        python3 - <<'PYCODE'
        import os,re
        assert re.fullmatch(r'[1-9][0-9]{5,17}',os.environ['CANDIDATE25_BUILD_RUN']), 'NUMERIC_BUILD_RUN_REQUIRED'
        PYCODE
  readback:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'VERIFY_DISPOSABLE_ANDROID_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: scripts/task25/candidate25.py
        sparse-checkout-cone-mode: false
    - name: Verify reviewed trusted helper hashes before use
      run: |-
        python3 - <<'PYCODE'
        import hashlib,pathlib
        pins={'candidate25.py': 'fd3a68c7044e29f0910a84051bd6ad4ba2951679f71e5d1fc86e2217baffae83'}
        for name,expected in pins.items():
         p=pathlib.Path('trusted/scripts/task25')/name
         assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REVIEWED_HELPER_DRIFT_STOP'
        print('REVIEWED_TRUSTED_HELPERS_PASS')
        PYCODE
    - name: Validate trusted workflow context
      run: python3 trusted/scripts/task25/candidate25.py trust
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
    - name: Install exact Android compiler tools
      run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - name: Independently download and verify signed APK bytes and public identity
      run: python3 trusted/scripts/task25/candidate25.py signed-data --run "$CANDIDATE25_BUILD_RUN"
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pair25-readback-${{ github.run_id }}
        path: ${{ runner.temp }}/SIGNED_PAIR_INDEPENDENT_READBACK_25.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve public blocker evidence
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pair25-readback-blocker-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/CANDIDATE25_BLOCKER.json
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: false
        overwrite: false
    needs: trust
  native35:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'VERIFY_DISPOSABLE_ANDROID_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: |-
          scripts/task25/candidate25.py
          scripts/task25/native25.py
          scripts/task25/emulator_fault25.py
        sparse-checkout-cone-mode: false
    - name: Verify reviewed trusted helper hashes before use
      run: |-
        python3 - <<'PYCODE'
        import hashlib,pathlib
        pins={'candidate25.py': 'fd3a68c7044e29f0910a84051bd6ad4ba2951679f71e5d1fc86e2217baffae83', 'native25.py': 'ce5493f6b29eef48b794927db58c09f10b5b970a73be370536e8678f5faff2b2', 'emulator_fault25.py': '994005738625212258a74320a669003be346ab2d06efeafbd857c5ecea6ab44f'}
        for name,expected in pins.items():
         p=pathlib.Path('trusted/scripts/task25')/name
         assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REVIEWED_HELPER_DRIFT_STOP'
        print('REVIEWED_TRUSTED_HELPERS_PASS')
        PYCODE
    - name: Validate trusted workflow context
      run: python3 trusted/scripts/task25/candidate25.py trust
    - name: Enable KVM on disposable GitHub hosted runner with actual VM capability check
      run: |-
        test -c /dev/kvm
        stat -c 'KVM before: mode=%a uid=%u gid=%g' /dev/kvm
        id
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-task25-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm settle --timeout=10
        sudo chmod 0666 /dev/kvm
        stat -c 'KVM after: mode=%a uid=%u gid=%g' /dev/kvm
        python3 - <<'PYCODE'
        import os,fcntl
        fd=os.open('/dev/kvm',os.O_RDWR|os.O_CLOEXEC)
        try:
         version=fcntl.ioctl(fd,0xAE00,0)
         assert version==12, 'KVM_API_VERSION_UNSUPPORTED'
         vm=fcntl.ioctl(fd,0xAE01,0)
         os.close(vm)
         print('PASS_REAL_KVM_OPEN_API12_EMPTY_VM_CREATE_CLOSE_NO_EMULATOR_YET')
        finally:
         os.close(fd)
        PYCODE
    - name: Free unused hosted-runner tools only (no project or remote data)
      run: |-
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/swift /opt/hostedtoolcache/CodeQL
        df -h "$RUNNER_TEMP"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 737ea741636e9abe7c20353d9d5b8301cf44a5bb
        path: appsource
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
    - name: Install exact Android compiler tools
      run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - name: Independently download and verify signed APK bytes and public identity
      run: python3 trusted/scripts/task25/candidate25.py signed-data --run "$CANDIDATE25_BUILD_RUN"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Read and verify immutable signed baseline28 artifact without draft write capability
      run: python3 trusted/scripts/task25/candidate25.py baseline-data --run "$CANDIDATE25_BUILD_RUN"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Native UI-created APK28 to APK29 preservation gate
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        TASK17_EMULATOR_PIN: 37.2.12
        TASK17_PROCESS_FORENSIC: 'true'
      with:
        api-level: 35
        target: default
        arch: x86_64
        avd-name: test
        profile: pixel_2
        disk-size: 3G
        ram-size: 2048M
        cores: 2
        force-avd-creation: true
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -accel on -skin 720x1280 -dpi-device 280 -no-window -gpu swiftshader -no-snapshot -noaudio
          -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
        pre-emulator-launch-script: python3 trusted/scripts/task25/native25.py --prepare-profile
        script: python3 trusted/scripts/task25/native25.py --edition "${{ matrix.edition }}" --api 35
    - name: Copy safe emulator exit diagnostics only; no guest memory
      if: always()
      run: |-
        python3 - <<'PYCODE'
        import json,os,pathlib,time
        source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.task17-forensics'
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'task25-native-evidence/forensics'
        out.mkdir(parents=True,exist_ok=True)
        for _ in range(10):
         files=list(source.glob('EMULATOR_FORENSIC_*.json'))
         if any(json.loads(path.read_text()).get('avdLaunch') for path in files):break
         time.sleep(1)
        for path in files:
         value=json.loads(path.read_text())
         allowed={'childPid','observedChildNames','sampleCount','schema','avdLaunch','exitCode','signal','wrapperReceivedSignals','before','after','durationSeconds','samples'}
         assert set(value)<=allowed, 'UNEXPECTED_FORENSIC_CONTENT_REFUSED'
         (out/path.name).write_text(json.dumps(value,indent=2)+chr(10))
        if not files:(out/'NO_EXIT_RECORD.json').write_text(json.dumps({'status':'EXIT_RECORD_NOT_AVAILABLE','noGuestMemoryRead':True}))
        print('SAFE_HOST_EXIT_DIAGNOSTIC_RECORDS='+str(len(files)))
        PYCODE
    - name: Extract bounded host exception module metadata; never upload raw dumps
      if: always()
      run: python3 trusted/scripts/task25/emulator_fault25.py
    - name: Preserve native evidence on success or failure
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native25-api35-${{ matrix.edition }}-${{ github.run_id }}
        path: |-
          ${{ runner.temp }}/task25-native-evidence/
          ${{ runner.temp }}/SIGNED_PAIR_INDEPENDENT_READBACK_25.json
          ${{ runner.temp }}/CANDIDATE25_BLOCKER.json
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: false
        overwrite: false
    needs: readback
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        edition: ${{ fromJSON(inputs.diagnostic_master_only && '["master"]' || '["master","client"]') }}
  native36:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'VERIFY_DISPOSABLE_ANDROID_ONLY' && !inputs.diagnostic_master_only
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: |-
          scripts/task25/candidate25.py
          scripts/task25/native25.py
          scripts/task25/emulator_fault25.py
        sparse-checkout-cone-mode: false
    - name: Verify reviewed trusted helper hashes before use
      run: |-
        python3 - <<'PYCODE'
        import hashlib,pathlib
        pins={'candidate25.py': 'fd3a68c7044e29f0910a84051bd6ad4ba2951679f71e5d1fc86e2217baffae83', 'native25.py': 'ce5493f6b29eef48b794927db58c09f10b5b970a73be370536e8678f5faff2b2', 'emulator_fault25.py': '994005738625212258a74320a669003be346ab2d06efeafbd857c5ecea6ab44f'}
        for name,expected in pins.items():
         p=pathlib.Path('trusted/scripts/task25')/name
         assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REVIEWED_HELPER_DRIFT_STOP'
        print('REVIEWED_TRUSTED_HELPERS_PASS')
        PYCODE
    - name: Validate trusted workflow context
      run: python3 trusted/scripts/task25/candidate25.py trust
    - name: Enable KVM on disposable GitHub hosted runner with actual VM capability check
