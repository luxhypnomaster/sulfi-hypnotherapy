        python3 - <<'PYCODE'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'task25-signed-quarantine/signed-manifest.json'
        m=json.loads(p.read_text());m.update(nativeSafety='PASS_NATIVE_UI28_TO29_MASTER_CLIENT_API35_API36',physicalPhones='NOT_RUN',safeForOwnerInstall=False,candidateForAuthorizedPhoneQA=True,ownerInstalledVersion='UNKNOWN',nativePlatform='AOSP(default) x86_64 API35/API36; Google NOT_RUN',knownAPI34EmulatorIssue='Host QEMU SIGSEGV on old28 before update; not claimed resolved')
