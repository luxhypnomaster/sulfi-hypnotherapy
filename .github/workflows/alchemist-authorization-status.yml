name: Alchemist 16-A authorization status (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'luxhypnomaster/sulfi-hypnotherapy'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned clasp before loading credentials
        run: npm install --prefix "$RUNNER_TEMP/clasp-tool" --ignore-scripts --no-audit --no-fund @google/clasp@3.4.1
      - name: Inspect existing server with repository secret (no deploy)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          ALCHEMIST_API: ${{ vars.SULFI_ALCHEMIST_API }}
        run: node scripts/alchemist/authorization-status.mjs
      - name: Save sanitized status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alchemist-authorization-status-${{ github.run_id }}
          path: ${{ runner.temp }}/alchemist-authorization-status/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/alchemist-status.clasprc.json"
