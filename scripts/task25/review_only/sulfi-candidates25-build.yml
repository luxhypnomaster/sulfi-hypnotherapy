name: Task25 isolated unsigned build and existing-key signer
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: BUILD_EXISTING_KEY_CANDIDATES_NO_DEPLOY
        required: true
        type: string
        default: ''
permissions: {}
concurrency:
  group: task25-candidate-build
  cancel-in-progress: false
env:
  CANDIDATE25_WORKFLOW: .github/workflows/sulfi-candidates25-build.yml
  CANDIDATE25_CONFIRMATION: ${{ inputs.confirmation }}
jobs:
  trust:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'BUILD_EXISTING_KEY_CANDIDATES_NO_DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
    - name: Reject untrusted dispatch before any checkout or secret
      run: |-
        python3 - <<'PYCODE'
        import os
        expected={'GITHUB_REPOSITORY':'luxhypnomaster/sulfi-hypnotherapy','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_REF':'refs/heads/main','GITHUB_REF_PROTECTED':'true','GITHUB_ACTOR':'luxhypnomaster','GITHUB_TRIGGERING_ACTOR':'luxhypnomaster','CANDIDATE25_CONFIRMATION':'BUILD_EXISTING_KEY_CANDIDATES_NO_DEPLOY'}
        assert all(os.environ.get(k)==v for k,v in expected.items()), 'OWNER_PROTECTED_MAIN_REQUIRED'
        print('TRUST_BOUNDARY_PASS_NO_SECRETS')
        PYCODE
  credentials:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'BUILD_EXISTING_KEY_CANDIDATES_NO_DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: scripts/task25/candidate25.py
        sparse-checkout-cone-mode: false
    - name: Verify reviewed trusted helper hashes before use
      run: |-
        python3 - <<'PYCODE'
        import hashlib,pathlib
        pins={'candidate25.py': '1218938034f746fbd56bf9c43b77a2235df510cfe2e10494443ec6c30fbe9b6a'}
        for name,expected in pins.items():
         p=pathlib.Path('trusted/scripts/task25')/name
         assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REVIEWED_HELPER_DRIFT_STOP'
        print('REVIEWED_TRUSTED_HELPERS_PASS')
        PYCODE
    - name: Validate trusted workflow context
      run: python3 trusted/scripts/task25/candidate25.py trust
    - name: Check existing bindings only
      run: python3 trusted/scripts/task25/candidate25.py credentials
      env:
        SULFI_TEST_KEYSTORE_BASE64: ${{ secrets.SULFI_TEST_KEYSTORE_BASE64 }}
        SULFI_TEST_STORE_PASSWORD: ${{ secrets.SULFI_TEST_STORE_PASSWORD }}
        SULFI_TEST_KEY_ALIAS: ${{ secrets.SULFI_TEST_KEY_ALIAS }}
        SULFI_TEST_KEY_PASSWORD: ${{ secrets.SULFI_TEST_KEY_PASSWORD }}
    - name: Preserve public blocker evidence
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: credentials25-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/CANDIDATE25_BLOCKER.json
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: false
        overwrite: false
    needs: trust
  build:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'BUILD_EXISTING_KEY_CANDIDATES_NO_DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: scripts/task25/candidate25.py
        sparse-checkout-cone-mode: false
    - name: Verify reviewed trusted helper hashes before use
      run: |-
        python3 - <<'PYCODE'
        import hashlib,pathlib
        pins={'candidate25.py': '1218938034f746fbd56bf9c43b77a2235df510cfe2e10494443ec6c30fbe9b6a'}
        for name,expected in pins.items():
         p=pathlib.Path('trusted/scripts/task25')/name
         assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REVIEWED_HELPER_DRIFT_STOP'
        print('REVIEWED_TRUSTED_HELPERS_PASS')
        PYCODE
    - name: Validate trusted workflow context
      run: python3 trusted/scripts/task25/candidate25.py trust
    - name: Free unused hosted-runner tools only (no project or remote data)
      run: |-
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/swift /opt/hostedtoolcache/CodeQL
        df -h "$RUNNER_TEMP"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 737ea741636e9abe7c20353d9d5b8301cf44a5bb
        path: appsource
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: flutter/flutter
        ref: c197ca5199e9ee5661e865596c9c07294dfab51c
        path: flutter-sdk
        persist-credentials: false
    - name: Use the exact tested Flutter framework
      run: |-
        git -C flutter-sdk switch --create stable
        echo "$GITHUB_WORKSPACE/flutter-sdk/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
    - name: Install exact Android compiler tools
      run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
    - name: Verify original signed APK28 and derive unchanged public configuration
      run: python3 trusted/scripts/task25/candidate25.py baseline
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build both unsigned candidates with no signing credentials or scoped token
      run: python3 trusted/scripts/task25/candidate25.py build
    - name: Handoff unsigned APK data only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: unsigned25-${{ github.run_id }}
        path: ${{ runner.temp }}/task25-unsigned/*
        if-no-files-found: error
        retention-days: 1
        include-hidden-files: false
        overwrite: false
    - name: Preserve public blocker evidence
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: unsigned25-blocker-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/CANDIDATE25_BLOCKER.json
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: false
        overwrite: false
    needs: credentials
  sign:
    if: github.repository == 'luxhypnomaster/sulfi-hypnotherapy' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'luxhypnomaster' && github.triggering_actor
      == 'luxhypnomaster' && inputs.confirmation == 'BUILD_EXISTING_KEY_CANDIDATES_NO_DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: scripts/task25/candidate25.py
        sparse-checkout-cone-mode: false
    - name: Verify reviewed trusted helper hashes before use
      run: |-
        python3 - <<'PYCODE'
        import hashlib,pathlib
        pins={'candidate25.py': '1218938034f746fbd56bf9c43b77a2235df510cfe2e10494443ec6c30fbe9b6a'}
        for name,expected in pins.items():
         p=pathlib.Path('trusted/scripts/task25')/name
         assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REVIEWED_HELPER_DRIFT_STOP'
        print('REVIEWED_TRUSTED_HELPERS_PASS')
        PYCODE
    - name: Validate trusted workflow context
      run: python3 trusted/scripts/task25/candidate25.py trust
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
    - name: Install exact Android compiler tools
      run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - name: Download exact current-run unsigned artifact as data
      run: python3 trusted/scripts/task25/candidate25.py unsigned-data
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Sign APK data using the existing certificate only
      run: python3 trusted/scripts/task25/candidate25.py sign
      env:
        SULFI_TEST_KEYSTORE_BASE64: ${{ secrets.SULFI_TEST_KEYSTORE_BASE64 }}
        SULFI_TEST_STORE_PASSWORD: ${{ secrets.SULFI_TEST_STORE_PASSWORD }}
        SULFI_TEST_KEY_ALIAS: ${{ secrets.SULFI_TEST_KEY_ALIAS }}
        SULFI_TEST_KEY_PASSWORD: ${{ secrets.SULFI_TEST_KEY_PASSWORD }}
    - name: Quarantine signed pair pending native safety; no public release
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: quarantine25-${{ github.run_id }}
        path: ${{ runner.temp }}/task25-signed-quarantine/*
        if-no-files-found: error
        retention-days: 3
        include-hidden-files: false
        overwrite: false
    - name: Preserve public blocker evidence
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sign25-blocker-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/CANDIDATE25_BLOCKER.json
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: false
        overwrite: false
    needs: build
